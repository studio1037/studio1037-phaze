name: PHAZE event lanes visual acceptance
on:
  pull_request:
    branches: [v0.2]
    types: [opened, synchronize, reopened]
    paths:
      - experiments/scale-c-event-lanes/**
      - .github/workflows/event-lanes-visual.yml
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node experiments/scale-c-event-lanes/verify.cjs
      - run: node experiments/scale-c-event-lanes/browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phaze-event-lanes-browser-screenshots
          path: visual-evidence/
          if-no-files-found: warn
